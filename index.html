<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tim Bargo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            font-family: 'Consolas', 'Monaco', 'Lucida Console', monospace;
        }
        
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        
        #name {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: clamp(3rem, 8vw, 8rem);
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            z-index: 10;
            pointer-events: none;
            letter-spacing: 0.1em;
        }
        
        @media (max-width: 768px) {
            #name {
                font-size: clamp(2rem, 12vw, 4rem);
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="name"></div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        "use strict";
        
        class TubePath {
            constructor(scene, colors) {
                this.scene = scene;
                this.colors = colors;
                
                // Sliding window parameters
                this.windowSize = 500; // Number of points in sliding window
                this.segmentLength = 5; // Distance between path points
                this.tubeRadius = 8; // Radius of tube interior
                
                // Path curve parameters
                this.noiseScale = 0.01; // Scale for meandering noise
                this.maxCurvature = 0.3; // Maximum curve angle
                
                // Sliding window state - SINGLE SOURCE OF TRUTH
                this.pathWindow = []; // The sliding window of path points
                this.windowStartIndex = 0; // Global index where window starts
                this.globalPathIndex = 0; // Total points generated so far
                
                // Path generation state
                this.currentPosition = new THREE.Vector3(0, 0, 10);
                this.currentDirection = new THREE.Vector3(0, 0, 1);
                
                // Rendering
                this.tubeMesh = null;
                this.lastGeometryUpdate = 0;
                this.geometryNeedsUpdate = false;
                
                this.generateInitialWindow();
                this.createTubeMesh();
            }
            
            generateInitialWindow() {
                // Generate initial sliding window of path points
                let position = this.currentPosition.clone();
                let direction = this.currentDirection.clone();
                
                for (let i = 0; i < this.windowSize; i++) {
                    // Add some organic meandering using noise-like functions
                    const t = this.globalPathIndex * this.noiseScale;
                    const curvatureX = Math.sin(t * 2.3) * Math.cos(t * 1.7) * this.maxCurvature;
                    const curvatureY = Math.cos(t * 1.9) * Math.sin(t * 2.1) * this.maxCurvature;
                    
                    // Gradually adjust direction
                    direction.x += curvatureX * 0.1;
                    direction.y += curvatureY * 0.1;
                    direction.normalize();
                    
                    // Move forward along the path
                    position = position.clone().add(direction.clone().multiplyScalar(this.segmentLength));
                    this.pathWindow.push(position.clone());
                    this.globalPathIndex++;
                }
                
                // Store generation state for future extensions
                this.currentPosition = position.clone();
                this.currentDirection = direction.clone();
            }
            
            createTubeMesh() {
                if (this.tubeMesh) {
                    this.scene.remove(this.tubeMesh);
                    this.tubeMesh.geometry.dispose();
                }
                
                if (this.pathWindow.length < 3) return;
                
                try {
                    // Create spline curve from current window - single source of truth
                    const curve = new THREE.CatmullRomCurve3(this.pathWindow, false, 'chordal', 0.1);
                    
                    // Create tube geometry
                    const segments = Math.max(8, Math.min(this.pathWindow.length * 2, 400));
                    const radialSegments = 12;
                    const tubeGeometry = new THREE.TubeGeometry(
                        curve, 
                        segments, 
                        this.tubeRadius, 
                        radialSegments, 
                        false
                    );
                
                    // Create vertex colors for blue gradient
                    const colors = [];
                    const positionAttribute = tubeGeometry.attributes.position;
                    const vertexCount = positionAttribute.count;
                    
                    for (let i = 0; i < vertexCount; i++) {
                        const segmentIndex = Math.floor(i / (radialSegments + 1));
                        const localT = Math.max(0, Math.min(1, segmentIndex / Math.max(1, segments - 1)));
                        
                        // Calculate global position along entire path for consistent colors
                        const globalT = (this.windowStartIndex + localT * this.pathWindow.length) / 500; // Longer distance for gradual color transitions
                        
                        const colorT = (globalT * Math.max(1, this.colors.length - 1)) % Math.max(1, this.colors.length);
                        const colorIndex = Math.floor(colorT);
                        const colorBlend = colorT - colorIndex;
                        
                        const safeColorIndex = Math.min(colorIndex, this.colors.length - 1);
                        const safeNextColorIndex = Math.min(colorIndex + 1, this.colors.length - 1);
                        
                        const currentColor = this.colors[safeColorIndex];
                        const nextColor = this.colors[safeNextColorIndex];
                        
                        const r1 = ((currentColor >> 16) & 255) / 255;
                        const g1 = ((currentColor >> 8) & 255) / 255;
                        const b1 = (currentColor & 255) / 255;
                        
                        const r2 = ((nextColor >> 16) & 255) / 255;
                        const g2 = ((nextColor >> 8) & 255) / 255;
                        const b2 = (nextColor & 255) / 255;
                        
                        const r = r1 + (r2 - r1) * colorBlend;
                        const g = g1 + (g2 - g1) * colorBlend;
                        const b = b1 + (b2 - b1) * colorBlend;
                        
                        colors.push(r, g, b);
                    }
                    
                    tubeGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
                    
                    const tubeMaterial = new THREE.MeshBasicMaterial({
                        vertexColors: true,
                        wireframe: true,
                        transparent: true,
                        opacity: 0.8
                    });
                    
                    this.tubeMesh = new THREE.Mesh(tubeGeometry, tubeMaterial);
                    this.scene.add(this.tubeMesh);
                    
                    this.lastGeometryUpdate = this.windowStartIndex;
                    
                } catch (error) {
                    console.warn('Tube geometry creation failed:', error);
                    return;
                }
            }
            
            // Synchronized camera positioning - uses same data as geometry
            getCameraPositionAtDistance(distance) {
                // Convert global distance to window-relative index
                const globalIndex = Math.floor(distance / this.segmentLength);
                const windowIndex = globalIndex - this.windowStartIndex;
                
                // Ensure we stay within current window bounds
                if (windowIndex < 0 || windowIndex >= this.pathWindow.length - 1) {
                    // Camera is outside current window - need to slide window
                    return null;
                }
                
                const t = (distance % this.segmentLength) / this.segmentLength;
                const p1 = this.pathWindow[windowIndex];
                const p2 = this.pathWindow[windowIndex + 1];
                
                const position = p1.clone().lerp(p2, t);
                const tangent = p2.clone().sub(p1).normalize();
                
                return { position, tangent, windowIndex };
            }
            
            // Slide the window forward when camera approaches end
            updateWindow(cameraDistance) {
                const globalIndex = Math.floor(cameraDistance / this.segmentLength);
                const windowIndex = globalIndex - this.windowStartIndex;
                
                // If camera is in last 1/4 of window, slide window forward
                if (windowIndex > this.windowSize * 0.75) {
                    this.slideWindowForward(50); // Slide by 50 points
                    return true; // Window was updated
                }
                
                return false; // No window update needed
            }
            
            // Slide window forward and generate new path points
            slideWindowForward(pointsToSlide) {
                console.log(`Sliding window forward by ${pointsToSlide} points`);
                
                // Remove points from front of window
                this.pathWindow.splice(0, pointsToSlide);
                this.windowStartIndex += pointsToSlide;
                
                // Generate new points at end of window
                for (let i = 0; i < pointsToSlide; i++) {
                    const t = this.globalPathIndex * this.noiseScale;
                    const curvatureX = Math.sin(t * 2.3) * Math.cos(t * 1.7) * this.maxCurvature;
                    const curvatureY = Math.cos(t * 1.9) * Math.sin(t * 2.1) * this.maxCurvature;
                    
                    this.currentDirection.x += curvatureX * 0.1;
                    this.currentDirection.y += curvatureY * 0.1;
                    this.currentDirection.normalize();
                    
                    this.currentPosition = this.currentPosition.clone().add(
                        this.currentDirection.clone().multiplyScalar(this.segmentLength)
                    );
                    this.pathWindow.push(this.currentPosition.clone());
                    this.globalPathIndex++;
                }
                
                // Mark that geometry needs update but don't do it immediately
                // This prevents sudden rotation jumps during camera movement
                this.geometryNeedsUpdate = true;
            }
            
            cleanup() {
                if (this.tubeMesh) {
                    this.scene.remove(this.tubeMesh);
                    this.tubeMesh.geometry.dispose();
                    this.tubeMesh = null;
                }
                this.pathWindow = [];
            }
        }
        
        class TubeScreensaver {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.scene = new THREE.Scene();
                this.lastTime = 0;
                
                // Blue color palette for tube
                this.colors = [
                    0x1E3A8A, // Deep blue
                    0x3B82F6, // Bright blue  
                    0x60A5FA, // Light blue
                    0x93C5FD, // Sky blue
                    0x2563EB, // Blue
                    0x1D4ED8, // Medium blue
                    0x1E40AF, // Dark blue
                    0x0EA5E9, // Cyan blue
                    0x0284C7  // Steel blue
                ];
                
                // Camera path following parameters
                this.travelDistance = 0; // Distance traveled along path
                this.travelSpeed = 20; // Speed of travel through tube (increased for smoother motion)
                
                // Smooth camera rotation with stable up vector
                this.cameraUp = new THREE.Vector3(0, 1, 0); // Maintain consistent up direction
                this.lastCameraOrientation = { 
                    forward: new THREE.Vector3(0, 0, 1),
                    up: new THREE.Vector3(0, 1, 0)
                };
                
                this.setupCamera();
                this.setupRenderer();
                this.setupLighting();
                this.setupTubePath();
                this.animate();
                
                window.addEventListener('resize', () => this.onWindowResize());
            }
            
            setupCamera() {
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                // Keep camera stationary at origin, looking forward
                this.camera.position.set(0, 0, 0);
                this.camera.lookAt(0, 0, 1); // Always look forward
            }
            
            setupRenderer() {
                this.renderer = new THREE.WebGLRenderer({
                    canvas: this.canvas,
                    antialias: true,
                    alpha: true
                });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setClearColor(0x000011, 1); // Dark blue for wireframe contrast
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            }
            
            setupLighting() {
                const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
                this.scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(10, 10, 5);
                this.scene.add(directionalLight);
                
                const light2 = new THREE.DirectionalLight(0x444444, 0.3);
                light2.position.set(-5, -5, -2);
                this.scene.add(light2);
                
                this.scene.fog = new THREE.Fog(0x000011, 80, 400); // Deep fog for tunnel effect
            }
            
            
            setupTubePath() {
                this.tubePath = new TubePath(this.scene, this.colors);
            }
            
            updateCameraMovement(deltaTime) {
                // Move camera along the tube path with consistent speed
                this.travelDistance += this.travelSpeed * deltaTime * 10;
                
                // Update sliding window if needed
                this.tubePath.updateWindow(this.travelDistance);
                
                // Check if geometry needs update after window slide
                if (this.tubePath.geometryNeedsUpdate) {
                    // Preserve current camera orientation before geometry update
                    const preservedForward = this.lastCameraOrientation.forward.clone();
                    const preservedUp = this.cameraUp.clone();
                    
                    // Update geometry now that window has slid
                    this.tubePath.createTubeMesh();
                    this.tubePath.geometryNeedsUpdate = false;
                    
                    // Restore preserved orientation to prevent jump
                    this.lastCameraOrientation.forward.copy(preservedForward);
                    this.cameraUp.copy(preservedUp);
                }
                
                // Get synchronized camera position from sliding window
                const pathInfo = this.tubePath.getCameraPositionAtDistance(this.travelDistance);
                if (pathInfo) {
                    // Position camera at the current path position
                    this.camera.position.copy(pathInfo.position);
                    
                    // Smooth forward direction interpolation to prevent flipping
                    this.lastCameraOrientation.forward.lerp(pathInfo.tangent, 0.1);
                    this.lastCameraOrientation.forward.normalize();
                    
                    // Maintain stable up vector - use Gram-Schmidt process to keep it perpendicular
                    const right = new THREE.Vector3().crossVectors(this.lastCameraOrientation.forward, this.cameraUp).normalize();
                    this.lastCameraOrientation.up.crossVectors(right, this.lastCameraOrientation.forward).normalize();
                    
                    // Smoothly interpolate up vector to prevent sudden rotations
                    this.cameraUp.lerp(this.lastCameraOrientation.up, 0.05);
                    this.cameraUp.normalize();
                    
                    // Set camera orientation using lookAt with stable up vector
                    const lookAtTarget = this.camera.position.clone().add(this.lastCameraOrientation.forward);
                    this.camera.up.copy(this.cameraUp);
                    this.camera.lookAt(lookAtTarget);
                } else {
                    console.warn('Camera outside sliding window - this should not happen!');
                }
            }
            
            
            animate() {
                requestAnimationFrame(() => this.animate());
                
                const currentTime = performance.now();
                const deltaTime = (currentTime - this.lastTime) * 0.001; // Convert to seconds
                this.lastTime = currentTime;
                
                // Update camera movement along tube path
                this.updateCameraMovement(deltaTime);
                
                this.renderer.render(this.scene, this.camera);
            }
            
            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }
        
        window.addEventListener('load', () => {
            new TubeScreensaver();
        });
    </script>
</body>
</html>
