<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tim Bargo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            font-family: 'Consolas', 'Monaco', 'Lucida Console', monospace;
        }
        
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        
        #name {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: clamp(3rem, 8vw, 8rem);
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            z-index: 10;
            pointer-events: none;
            letter-spacing: 0.1em;
        }
        
        @media (max-width: 768px) {
            #name {
                font-size: clamp(2rem, 12vw, 4rem);
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="name">TIM BARGO</div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        "use strict";
        
        class SmoothPipe {
            constructor(scene, startPosition, startDirection, color, isLucky = false) {
                this.scene = scene;
                this.controlPoints = [startPosition.clone()];
                this.controlPointColors = [isLucky ? this.getCurrentRainbowColor(0) : color];
                this.currentPosition = startPosition.clone();
                this.currentDirection = startDirection.clone().normalize();
                this.targetDirection = startDirection.clone();
                this.color = color;
                this.isLucky = isLucky;
                this.colorPhase = 0;
                
                // Growth parameters
                this.growthSpeed = 0.6;
                this.maxLength = 120;
                this.lastGrowthTime = 0;
                this.growthInterval = 50;
                
                // Steering parameters for tighter curves
                this.wanderStrength = 0.12;
                this.directionChangeSpeed = 0.20;
                this.boundaryForce = 0.25;
                this.bounds = 18;
                
                // Rendering
                this.material = new THREE.MeshPhongMaterial({
                    color: color,
                    shininess: this.isLucky ? 200 : 100,
                    specular: this.isLucky ? 0x888888 : 0x444444
                });
                this.tubeMesh = null;
                
                this.updateTubeGeometry();
            }
            
            update(currentTime, allPipes) {
                if (currentTime - this.lastGrowthTime < this.growthInterval) {
                    return true;
                }
                this.lastGrowthTime = currentTime;
                
                if (this.isLucky) {
                    this.colorPhase += 0.01;
                }
                
                this.updateSteering(allPipes);
                this.extendCurve();
                
                if (this.controlPoints.length > this.maxLength) {
                    this.controlPoints.shift();
                    this.controlPointColors.shift();
                }
                
                this.updateTubeGeometry();
                return true;
            }
            
            getCurrentRainbowColor(phase = this.colorPhase) {
                const hue = (phase % 1.0);
                const saturation = 1.0;
                const brightness = 1.0;
                
                const color = this.hsvToRgb(hue, saturation, brightness);
                const hexColor = (color.r << 16) | (color.g << 8) | color.b;
                
                return hexColor;
            }
            
            hsvToRgb(h, s, v) {
                let r, g, b;
                const i = Math.floor(h * 6);
                const f = h * 6 - i;
                const p = v * (1 - s);
                const q = v * (1 - f * s);
                const t = v * (1 - (1 - f) * s);
                
                switch (i % 6) {
                    case 0: r = v; g = t; b = p; break;
                    case 1: r = q; g = v; b = p; break;
                    case 2: r = p; g = v; b = t; break;
                    case 3: r = p; g = q; b = v; break;
                    case 4: r = t; g = p; b = v; break;
                    case 5: r = v; g = p; b = q; break;
                }
                
                return {
                    r: Math.round(r * 255),
                    g: Math.round(g * 255),
                    b: Math.round(b * 255)
                };
            }
            
            updateSteering(allPipes) {
                const wanderForce = new THREE.Vector3(
                    (Math.random() - 0.5) * this.wanderStrength,
                    (Math.random() - 0.5) * this.wanderStrength,
                    (Math.random() - 0.5) * this.wanderStrength
                );
                
                const boundaryForce = this.getBoundaryAvoidanceForce();
                const avoidanceForce = this.getCollisionAvoidanceForce(allPipes);
                
                this.targetDirection.add(wanderForce)
                                  .add(boundaryForce)
                                  .add(avoidanceForce)
                                  .normalize();
                
                this.currentDirection.lerp(this.targetDirection, this.directionChangeSpeed).normalize();
            }
            
            getBoundaryAvoidanceForce() {
                const force = new THREE.Vector3(0, 0, 0);
                const pos = this.currentPosition;
                
                if (pos.x > this.bounds) force.x = -this.boundaryForce;
                if (pos.x < -this.bounds) force.x = this.boundaryForce;
                if (pos.y > this.bounds) force.y = -this.boundaryForce;
                if (pos.y < -this.bounds) force.y = this.boundaryForce;
                if (pos.z > this.bounds) force.z = -this.boundaryForce;
                if (pos.z < -this.bounds) force.z = this.boundaryForce;
                
                return force;
            }
            
            getCollisionAvoidanceForce(allPipes) {
                const force = new THREE.Vector3(0, 0, 0);
                const avoidanceRadius = 2.5;
                
                for (const otherPipe of allPipes) {
                    if (otherPipe === this) continue;
                    
                    const distance = this.currentPosition.distanceTo(otherPipe.currentPosition);
                    if (distance < avoidanceRadius && distance > 0.1) {
                        const avoidDirection = this.currentPosition.clone()
                                             .sub(otherPipe.currentPosition)
                                             .normalize()
                                             .multiplyScalar(0.05 / distance);
                        force.add(avoidDirection);
                    }
                }
                
                return force;
            }
            
            extendCurve() {
                const nextPosition = this.currentPosition.clone()
                                   .add(this.currentDirection.clone().multiplyScalar(this.growthSpeed));
                
                this.currentPosition = nextPosition;
                this.controlPoints.push(nextPosition.clone());
                
                const newColor = this.isLucky ? this.getCurrentRainbowColor() : this.color;
                this.controlPointColors.push(newColor);
            }
            
            updateTubeGeometry() {
                if (this.tubeMesh) {
                    this.scene.remove(this.tubeMesh);
                    this.tubeMesh.geometry.dispose();
                }
                
                if (this.controlPoints.length < 2) return;
                
                try {
                    if (this.isLucky) {
                        this.createRainbowTubeGeometry();
                    } else {
                        const curve = new THREE.CatmullRomCurve3(this.controlPoints, false);
                        const tubeGeometry = new THREE.TubeGeometry(
                            curve,
                            Math.max(this.controlPoints.length * 2, 16),
                            0.12,
                            6,
                            false
                        );
                        this.tubeMesh = new THREE.Mesh(tubeGeometry, this.material);
                        this.scene.add(this.tubeMesh);
                    }
                } catch (error) {
                    console.warn('Tube geometry creation failed:', error);
                }
            }
            
            createRainbowTubeGeometry() {
                if (this.glowMesh) {
                    this.scene.remove(this.glowMesh);
                    this.glowMesh.geometry.dispose();
                    this.glowMesh = null;
                }
                
                if (this.etherealLights) {
                    this.etherealLights.forEach(light => this.scene.remove(light));
                    this.etherealLights = [];
                }
                
                const curve = new THREE.CatmullRomCurve3(this.controlPoints, false);
                const segments = Math.max(this.controlPoints.length * 2, 16);
                const radius = 0.18;
                const radialSegments = 8;
                
                const tubeGeometry = new THREE.TubeGeometry(curve, segments, radius, radialSegments, false);
                
                const colors = [];
                const positionAttribute = tubeGeometry.attributes.position;
                const vertexCount = positionAttribute.count;
                
                for (let i = 0; i < vertexCount; i++) {
                    const segmentIndex = Math.floor(i / (radialSegments + 1));
                    const t = segmentIndex / segments;
                    const colorIndex = Math.floor(t * (this.controlPointColors.length - 1));
                    const hexColor = this.controlPointColors[colorIndex] || this.controlPointColors[0];
                    
                    const r = ((hexColor >> 16) & 255) / 255;
                    const g = ((hexColor >> 8) & 255) / 255;
                    const b = (hexColor & 255) / 255;
                    
                    colors.push(r, g, b);
                }
                
                tubeGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
                
                const vertexColorMaterial = new THREE.MeshPhongMaterial({
                    vertexColors: true,
                    shininess: 300,
                    specular: 0xffffff,
                    emissive: 0x111111,
                    transparent: true,
                    opacity: 0.9
                });
                
                this.tubeMesh = new THREE.Mesh(tubeGeometry, vertexColorMaterial);
                this.scene.add(this.tubeMesh);
                
                this.createGlowEffect(curve, segments, radius, radialSegments);
            }
            
            createGlowEffect(curve, segments, radius, radialSegments) {
                const glowRadius = radius * 1.6;
                const glowGeometry = new THREE.TubeGeometry(curve, segments, glowRadius, radialSegments, false);
                
                const glowColors = [];
                const positionAttribute = glowGeometry.attributes.position;
                const vertexCount = positionAttribute.count;
                
                for (let i = 0; i < vertexCount; i++) {
                    const segmentIndex = Math.floor(i / (radialSegments + 1));
                    const t = segmentIndex / segments;
                    const colorIndex = Math.floor(t * (this.controlPointColors.length - 1));
                    const hexColor = this.controlPointColors[colorIndex] || this.controlPointColors[0];
                    
                    const r = Math.min(1.0, ((hexColor >> 16) & 255) / 255 * 1.2);
                    const g = Math.min(1.0, ((hexColor >> 8) & 255) / 255 * 1.2);
                    const b = Math.min(1.0, (hexColor & 255) / 255 * 1.2);
                    
                    glowColors.push(r, g, b);
                }
                
                glowGeometry.setAttribute('color', new THREE.Float32BufferAttribute(glowColors, 3));
                
                const glowMaterial = new THREE.MeshBasicMaterial({
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.3,
                    blending: THREE.AdditiveBlending,
                    side: THREE.BackSide
                });
                
                this.glowMesh = new THREE.Mesh(glowGeometry, glowMaterial);
                this.scene.add(this.glowMesh);
                
                this.addEtherealLights();
            }
            
            addEtherealLights() {
                if (this.etherealLights) {
                    this.etherealLights.forEach(light => this.scene.remove(light));
                }
                this.etherealLights = [];
                
                const lightInterval = Math.max(1, Math.floor(this.controlPoints.length / 8));
                for (let i = 0; i < this.controlPoints.length; i += lightInterval) {
                    const position = this.controlPoints[i];
                    const hexColor = this.controlPointColors[i];
                    
                    const light = new THREE.PointLight(hexColor, 0.2, 3);
                    light.position.copy(position);
                    
                    this.scene.add(light);
                    this.etherealLights.push(light);
                }
            }
            
            cleanup() {
                if (this.tubeMesh) {
                    this.scene.remove(this.tubeMesh);
                    this.tubeMesh.geometry.dispose();
                    this.tubeMesh = null;
                }
                
                if (this.glowMesh) {
                    this.scene.remove(this.glowMesh);
                    this.glowMesh.geometry.dispose();
                    this.glowMesh = null;
                }
                
                if (this.etherealLights) {
                    this.etherealLights.forEach(light => this.scene.remove(light));
                    this.etherealLights = [];
                }
                
                this.controlPoints = [];
                this.controlPointColors = [];
            }
        }
        
        class PipeScreensaver {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.scene = new THREE.Scene();
                this.pipes = [];
                this.maxPipes = 18;
                this.lastTime = 0;
                this.luckyPipeCreated = false;
                
                this.colors = [
                    0x00FFFF, 0xFF00FF, 0xFFFF00, 0x00FF00,
                    0xFF6600, 0x0066FF, 0xFF0066, 0x66FF00
                ];
                
                this.setupCamera();
                this.setupRenderer();
                this.setupLighting();
                this.setupInitialPipes();
                this.animate();
                
                window.addEventListener('resize', () => this.onWindowResize());
            }
            
            setupCamera() {
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
                this.camera.position.set(20, 15, 20);
                this.camera.lookAt(0, 0, 0);
            }
            
            setupRenderer() {
                this.renderer = new THREE.WebGLRenderer({
                    canvas: this.canvas,
                    antialias: true,
                    alpha: true
                });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setClearColor(0x000000, 1);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            }
            
            setupLighting() {
                const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
                this.scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(10, 10, 5);
                this.scene.add(directionalLight);
                
                const light2 = new THREE.DirectionalLight(0x444444, 0.3);
                light2.position.set(-5, -5, -2);
                this.scene.add(light2);
                
                this.scene.fog = new THREE.Fog(0x000000, 30, 80);
            }
            
            setupInitialPipes() {
                this.createPipe(true);
                for (let i = 0; i < 7; i++) {
                    this.createPipe();
                }
            }
            
            createPipe(isLucky = false) {
                if (this.pipes.length >= this.maxPipes) return;
                
                if (isLucky && this.luckyPipeCreated) {
                    isLucky = false;
                }
                
                const startPos = new THREE.Vector3(
                    (Math.random() - 0.5) * 24,
                    (Math.random() - 0.5) * 24,
                    (Math.random() - 0.5) * 24
                );
                
                const startDir = new THREE.Vector3(
                    Math.random() - 0.5,
                    Math.random() - 0.5,
                    Math.random() - 0.5
                ).normalize();
                
                const color = isLucky ? 0xFF0000 : this.colors[Math.floor(Math.random() * this.colors.length)];
                
                const pipe = new SmoothPipe(this.scene, startPos, startDir, color, isLucky);
                this.pipes.push(pipe);
                
                if (isLucky) {
                    this.luckyPipeCreated = true;
                }
            }
            
            animate() {
                requestAnimationFrame(() => this.animate());
                
                const currentTime = performance.now();
                
                const time = currentTime * 0.0003;
                const radius = 30;
                this.camera.position.x = Math.cos(time) * radius;
                this.camera.position.z = Math.sin(time) * radius;
                this.camera.position.y = 15 + Math.sin(time * 0.7) * 8;
                this.camera.lookAt(0, 0, 0);
                
                this.pipes.forEach(pipe => {
                    pipe.update(currentTime, this.pipes);
                });
                
                if (Math.random() < 0.02 && this.pipes.length < this.maxPipes) {
                    this.createPipe();
                }
                
                this.renderer.render(this.scene, this.camera);
            }
            
            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }
        
        window.addEventListener('load', () => {
            new PipeScreensaver();
        });
    </script>
</body>
</html>
